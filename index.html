<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator QR Code Templat Ulasan Google</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-500/30">
                    <i data-lucide="qr-code" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none text-white">Google Review QR Studio</h1>
                    <p class="text-xs text-slate-400 mt-1">Cetak Akrilik & Poster Ulasan Google</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="downloadPoster()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-medium text-sm flex items-center gap-2 transition shadow-lg shadow-blue-600/20 active:scale-95">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>Unduh PNG</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Panel: Controls & Input -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- Step 1: Input URL -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <label class="block text-sm font-semibold text-slate-200 mb-2 flex items-center gap-2">
                    <i data-lucide="link" class="w-4 h-4 text-blue-400"></i>
                    1. Tautan Ulasan Google / URL
                </label>
                <div class="relative">
                    <input type="url" id="qrInput" 
                        value="https://g.page/r/c/review" 
                        placeholder="https://g.page/r/your-google-review-link"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition pr-10">
                    <button onclick="document.getElementById('qrInput').value=''; renderCanvas();" class="absolute right-3 top-3 text-slate-500 hover:text-slate-300">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <p class="text-xs text-slate-400 mt-2">Dapatkan link ini dari Google Bisnisku > "Minta Ulasan".</p>
            </div>

            <!-- Step 2: Select Template -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <label class="block text-sm font-semibold text-slate-200 mb-3 flex items-center gap-2">
                    <i data-lucide="layout-template" class="w-4 h-4 text-blue-400"></i>
                    2. Pilih Desain Templat
                </label>
                
                <div class="grid grid-cols-2 gap-3">
                    <!-- Template 1 -->
                    <button onclick="selectTemplate('a5_bright')" id="btn_a5_bright" class="tpl-btn border-2 border-blue-500 bg-blue-500/10 p-3 rounded-xl flex flex-col items-center gap-2 text-left transition hover:border-blue-400">
                        <div class="w-full aspect-[2/3] bg-slate-800 rounded-lg overflow-hidden border border-slate-700 relative">
                            <div class="absolute inset-0 bg-white flex flex-col items-center justify-between p-2">
                                <div class="w-3 h-3 rounded-full bg-red-500 mt-1"></div>
                                <div class="w-full h-1/2 bg-blue-600 rounded-t-full mt-auto relative p-1">
                                    <div class="w-full h-full bg-white rounded flex items-center justify-end p-1">
                                        <div class="w-1/2 aspect-square bg-slate-900 rounded-sm"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <span class="text-xs font-medium text-slate-200 text-center">A5 Cerah</span>
                    </button>

                    <!-- Template 2 -->
                    <button onclick="selectTemplate('a5_dark')" id="btn_a5_dark" class="tpl-btn border-2 border-slate-800 bg-slate-950 p-3 rounded-xl flex flex-col items-center gap-2 text-left transition hover:border-blue-400">
                        <div class="w-full aspect-[2/3] bg-slate-800 rounded-lg overflow-hidden border border-slate-700 relative">
                            <div class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-between p-2">
                                <div class="w-3 h-3 rounded-full bg-red-500 mt-1"></div>
                                <div class="w-full h-1/2 bg-blue-600 rounded-t-full mt-auto relative p-1">
                                    <div class="w-full h-full bg-slate-900 rounded flex items-center justify-end p-1">
                                        <div class="w-1/2 aspect-square bg-slate-950 rounded-sm border border-slate-800"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <span class="text-xs font-medium text-slate-200 text-center">A5 Gelap</span>
                    </button>

                    <!-- Template 3 -->
                    <button onclick="selectTemplate('sq_bright')" id="btn_sq_bright" class="tpl-btn border-2 border-slate-800 bg-slate-950 p-3 rounded-xl flex flex-col items-center gap-2 text-left transition hover:border-blue-400">
                        <div class="w-full aspect-square bg-slate-800 rounded-lg overflow-hidden border border-slate-700 relative">
                            <div class="absolute inset-0 bg-white flex flex-col justify-between">
                                <div class="h-1/2 bg-blue-600"></div>
                                <div class="p-2 flex justify-end">
                                    <div class="w-1/2 aspect-square bg-slate-900 rounded-sm"></div>
                                </div>
                            </div>
                        </div>
                        <span class="text-xs font-medium text-slate-200 text-center">10x10 Cerah</span>
                    </button>

                    <!-- Template 4 -->
                    <button onclick="selectTemplate('sq_dark')" id="btn_sq_dark" class="tpl-btn border-2 border-slate-800 bg-slate-950 p-3 rounded-xl flex flex-col items-center gap-2 text-left transition hover:border-blue-400">
                        <div class="w-full aspect-square bg-slate-800 rounded-lg overflow-hidden border border-slate-700 relative">
                            <div class="absolute inset-0 bg-slate-950 flex flex-col justify-between">
                                <div class="h-1/2 bg-slate-900 border-b border-blue-500"></div>
                                <div class="p-2 flex justify-end">
                                    <div class="w-1/2 aspect-square bg-slate-900 rounded-sm border border-slate-800"></div>
                                </div>
                            </div>
                        </div>
                        <span class="text-xs font-medium text-slate-200 text-center">10x10 Gelap</span>
                    </button>
                </div>
            </div>

            <!-- Step 3: QR Customization & Adjustment -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <label class="block text-sm font-semibold text-slate-200 flex items-center justify-between">
                    <span class="flex items-center gap-2">
                        <i data-lucide="sliders" class="w-4 h-4 text-blue-400"></i>
                        3. Kustomisasi & Kalibrasi QR
                    </span>
                </label>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-slate-400 mb-1 block">Warna QR</label>
                        <input type="color" id="qrColor" value="#000000" onchange="renderCanvas()" class="w-full h-9 bg-slate-950 border border-slate-700 rounded-lg cursor-pointer p-1">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 mb-1 block">Logo Google</label>
                        <button id="toggleLogoBtn" onclick="toggleLogo()" class="w-full h-9 bg-blue-600 text-white rounded-lg text-xs font-medium flex items-center justify-center gap-1">
                            <i data-lucide="check" class="w-3.5 h-3.5"></i>
                            Tampilkan Logo
                        </button>
                    </div>
                </div>

                <!-- Calibration Sliders -->
                <div class="border-t border-slate-800 pt-3 space-y-3">
                    <p class="text-xs font-medium text-slate-400">Presisi Posisi QR Code (Jika Perlu):</p>
                    <div>
                        <div class="flex justify-between text-xs text-slate-400 mb-1">
                            <span>Ukuran QR (Scale)</span>
                            <span id="valScale">100%</span>
                        </div>
                        <input type="range" id="scaleInput" min="50" max="150" value="100" oninput="renderCanvas()" class="w-full accent-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <div class="flex justify-between text-xs text-slate-400 mb-1">
                                <span>Posisi X</span>
                                <span id="valX">0</span>
                            </div>
                            <input type="range" id="posXInput" min="-100" max="100" value="0" oninput="renderCanvas()" class="w-full accent-blue-500">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs text-slate-400 mb-1">
                                <span>Posisi Y</span>
                                <span id="valY">0</span>
                            </div>
                            <input type="range" id="posYInput" min="-100" max="100" value="0" oninput="renderCanvas()" class="w-full accent-blue-500">
                        </div>
                    </div>
                    <button onclick="resetCalibration()" class="text-xs text-slate-400 hover:text-white underline">
                        Reset Posisi ke Default
                    </button>
                </div>
            </div>

            <!-- Custom Upload Option -->
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4">
                <label class="block text-xs font-medium text-slate-400 mb-2">Punya File High-Res Sendiri?</label>
                <input type="file" id="customTemplateUpload" accept="image/*" onchange="handleCustomUpload(event)" class="hidden">
                <button onclick="document.getElementById('customTemplateUpload').click()" class="w-full py-2 border border-dashed border-slate-700 hover:border-slate-500 rounded-xl text-xs text-slate-300 flex items-center justify-center gap-2 transition">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    Unggah Gambar Templat Asli (.PNG / .JPG)
                </button>
            </div>

        </div>

        <!-- Right Panel: Live Canvas Preview -->
        <div class="lg:col-span-7 flex flex-col items-center justify-start space-y-4">
            
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 w-full flex flex-col items-center justify-center shadow-2xl relative min-h-[500px]">
                
                <div class="absolute top-4 left-4 flex items-center gap-2 bg-slate-950/80 px-3 py-1.5 rounded-full border border-slate-800">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-xs text-slate-300 font-medium" id="currentTemplateLabel">A5 Cerah</span>
                </div>

                <!-- Canvas Preview Container -->
                <div class="relative max-w-full overflow-hidden flex items-center justify-center my-4">
                    <canvas id="posterCanvas" class="max-h-[65vh] w-auto h-auto rounded-lg shadow-2xl border border-slate-800"></canvas>
                </div>

                <p class="text-xs text-slate-500">Pratinjau langsung sesuai dengan hasil unduhan PNG akhir.</p>
            </div>

            <!-- Quick Action Buttons -->
            <div class="w-full grid grid-cols-2 gap-4">
                <button onclick="downloadPoster()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl flex items-center justify-center gap-2 transition shadow-lg shadow-blue-600/20 active:scale-95">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    Unduh Gambar (PNG)
                </button>
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 rounded-xl flex items-center justify-center gap-2 transition border border-slate-700 active:scale-95">
                    <i data-lucide="printer" class="w-4 h-4"></i>
                    Cetak Direct / PDF
                </button>
            </div>

        </div>

    </main>

    <!-- Hidden Temporary Container for QR Code generation -->
    <div id="qrcode-hidden" class="hidden"></div>

    <!-- Application Script -->
    <script>
        // Init Lucide Icons
        lucide.createIcons();

        // State Management
        let currentTemplate = 'a5_bright';
        let showGoogleLogo = true;
        let customImageLoaded = null;

        // Base Configuration for Templates and QR Code Coordinates
        const templates = {
            a5_bright: {
                name: "A5 Cerah",
                aspect: 2/3,
                qrBox: { x: 535, y: 685, w: 320, h: 320 }, // Exact bounding box relative to template resolution
                drawBase: function(ctx, width, height) {
                    // Draw White Background
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);

                    // Top Google Pin Icon
                    drawGooglePin(ctx, width / 2, height * 0.1, 40);

                    // Title Text
                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 52px "Plus Jakarta Sans", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Bantu kami dengan', width / 2, height * 0.22);

                    ctx.fillStyle = '#1d4ed8';
                    ctx.fillText('ulasan Anda', width / 2, height * 0.28);

                    // 5 Stars
                    drawStars(ctx, width / 2, height * 0.34, 30);

                    // Center Google "G" Badge
                    drawGoogleBadge(ctx, width / 2, height * 0.5, 120);

                    // Blue Bottom Wave Arc
                    ctx.fillStyle = '#1d4ed8';
                    ctx.beginPath();
                    ctx.moveTo(0, height * 0.68);
                    ctx.quadraticCurveTo(width / 2, height * 0.52, width, height * 0.68);
                    ctx.lineTo(width, height);
                    ctx.lineTo(0, height);
                    ctx.closePath();
                    ctx.fill();

                    // White Card Container for NFC & QR
                    const cardX = width * 0.1;
                    const cardY = height * 0.65;
                    const cardW = width * 0.8;
                    const cardH = height * 0.27;
                    
                    ctx.fillStyle = '#ffffff';
                    drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 28);
                    ctx.fill();

                    // Left NFC Illustration Text
                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 30px "Plus Jakarta Sans", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Tap atau Scan', cardX + cardW * 0.25, cardY + cardH * 0.82);

                    drawPhoneNFC(ctx, cardX + cardW * 0.25, cardY + cardH * 0.42, 60, false);

                    // Divider Line
                    ctx.strokeStyle = '#e2e8f0';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(cardX + cardW * 0.48, cardY + cardH * 0.15);
                    ctx.lineTo(cardX + cardW * 0.48, cardY + cardH * 0.85);
                    ctx.stroke();

                    // QR Slot Border Box
                    ctx.strokeStyle = '#1d4ed8';
                    ctx.lineWidth = 5;
                    drawRoundedRect(ctx, 525, 675, 340, 340, 24);
                    ctx.stroke();
                }
            },
            a5_dark: {
                name: "A5 Gelap",
                aspect: 2/3,
                qrBox: { x: 535, y: 685, w: 320, h: 320 },
                drawBase: function(ctx, width, height) {
                    // Dark Background
                    ctx.fillStyle = '#090d16';
                    ctx.fillRect(0, 0, width, height);

                    // Top Google Pin Icon
                    drawGooglePin(ctx, width / 2, height * 0.1, 40);

                    // Title Text
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 52px "Plus Jakarta Sans", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Bantu kami dengan', width / 2, height * 0.22);

                    ctx.fillStyle = '#3b82f6';
                    ctx.fillText('ulasan Anda', width / 2, height * 0.28);

                    // 5 Stars
                    drawStars(ctx, width / 2, height * 0.34, 30);

                    // Center Google "G" Badge
                    drawGoogleBadge(ctx, width / 2, height * 0.5, 120);

                    // Blue Bottom Wave Arc
                    ctx.fillStyle = '#1e40af';
                    ctx.beginPath();
                    ctx.moveTo(0, height * 0.68);
                    ctx.quadraticCurveTo(width / 2, height * 0.52, width, height * 0.68);
                    ctx.lineTo(width, height);
                    ctx.lineTo(0, height);
                    ctx.closePath();
                    ctx.fill();

                    // Dark Card Container for NFC & QR
                    const cardX = width * 0.1;
                    const cardY = height * 0.65;
                    const cardW = width * 0.8;
                    const cardH = height * 0.27;
                    
                    ctx.fillStyle = '#0f172a';
                    drawRoundedRect(ctx, cardX, cardY, cardW, cardH, 28);
                    ctx.fill();

                    // Left NFC Text
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 30px "Plus Jakarta Sans", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Tap atau Scan', cardX + cardW * 0.25, cardY + cardH * 0.82);

                    drawPhoneNFC(ctx, cardX + cardW * 0.25, cardY + cardH * 0.42, 60, true);

                    // Divider Line
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(cardX + cardW * 0.48, cardY + cardH * 0.15);
                    ctx.lineTo(cardX + cardW * 0.48, cardY + cardH * 0.85);
                    ctx.stroke();

                    // QR Slot Border Box
                    ctx.strokeStyle = '#2563eb';
                    ctx.lineWidth = 5;
                    drawRoundedRect(ctx, 525, 675, 340, 340, 24);
                    ctx.stroke();
                }
            },
            sq_bright: {
                name: "10x10 cm Cerah",
                aspect: 1,
                qrBox: { x: 610, y: 560, w: 320, h: 320 },
                drawBase: function(ctx, width, height) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, width, height);

                    // Blue Upper Arc
                    ctx.fillStyle = '#1d4ed8';
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(width, 0);
                    ctx.lineTo(width, height * 0.48);
                    ctx.quadraticCurveTo(width / 2, height * 0.54, 0, height * 0.42);
                    ctx.closePath();
                    ctx.fill();

                    // Google "G" Badge Top Left
                    drawGoogleBadge(ctx, width * 0.24, height * 0.23, 110);

                    // "review us on Google" Text
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 48px "Plus Jakarta Sans", sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText('review us', width * 0.48, height * 0.18);
                    ctx.font = 'bold 58px "Plus Jakarta Sans", sans-serif';
                    ctx.fillText('on Google', width * 0.43, height * 0.28);

                    // Stars
                    drawStars(ctx, width * 0.65, height * 0.36, 26);

                    // Bottom Section
                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 36px "Plus Jakarta Sans", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Tap your phone', width * 0.28, height * 0.56);

                    drawPhoneNFC(ctx, width * 0.28, height * 0.74, 70, false);

                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 36px "Plus Jakarta Sans", sans-serif';
                    ctx.fillText('or', width * 0.53, height * 0.73);

                    // QR Slot Box Frame
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = 5;
                    drawRoundedRect(ctx, 600, 550, 340, 340, 24);
                    ctx.stroke();
                }
            },
            sq_dark: {
                name: "10x10 cm Gelap",
                aspect: 1,
                qrBox: { x: 610, y: 560, w: 320, h: 320 },
                drawBase: function(ctx, width, height) {
                    ctx.fillStyle = '#070b12';
                    ctx.fillRect(0, 0, width, height);

                    // Upper Blue Divider Arc Line
                    ctx.strokeStyle = '#2563eb';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(0, height * 0.5);
                    ctx.quadraticCurveTo(width / 2, height * 0.42, width, height * 0.5);
                    ctx.stroke();

                    // Google Badge
                    drawGoogleBadge(ctx, width * 0.24, height * 0.23, 110);

                    // Text
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 48px "Plus Jakarta Sans", sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText('review us', width * 0.48, height * 0.18);
                    ctx.font = 'bold 58px "Plus Jakarta Sans", sans-serif';
                    ctx.fillText('on Google', width * 0.43, height * 0.28);

                    // Stars
                    drawStars(ctx, width * 0.65, height * 0.36, 26);

                    // Bottom Text & Phone Icon
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 36px "Plus Jakarta Sans", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('Tap your phone', width * 0.28, height * 0.56);

                    drawPhoneNFC(ctx, width * 0.28, height * 0.74, 70, true);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 36px "Plus Jakarta Sans", sans-serif';
                    ctx.fillText('or', width * 0.53, height * 0.73);

                    // QR Slot Frame Box
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 4;
                    drawRoundedRect(ctx, 600, 550, 340, 340, 24);
                    ctx.stroke();
                }
            }
        };

        // Helper Drawing Functions
        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function drawStars(ctx, cx, cy, size) {
            const gap = size * 1.5;
            const startX = cx - (gap * 2);
            for (let i = 0; i < 5; i++) {
                drawSingleStar(ctx, startX + (i * gap), cy, size, '#fbbf24');
            }
        }

        function drawSingleStar(ctx, cx, cy, r, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r + cx, -Math.sin((18 + i * 72) * Math.PI / 180) * r + cy);
                ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r/2) + cx, -Math.sin((54 + i * 72) * Math.PI / 180) * (r/2) + cy);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawGooglePin(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            // Red Top
            ctx.fillStyle = '#ea4335';
            ctx.beginPath(); ctx.arc(0, 0, size, Math.PI, 0); ctx.fill();
            // Yellow Left
            ctx.fillStyle = '#fbbc05';
            ctx.beginPath(); ctx.arc(0, 0, size, Math.PI * 0.7, Math.PI); ctx.fill();
            // Blue Right
            ctx.fillStyle = '#4285f4';
            ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 0.3); ctx.fill();
            // Green Bottom
            ctx.fillStyle = '#34a853';
            ctx.beginPath(); ctx.moveTo(-size, 0); ctx.lineTo(0, size * 1.8); ctx.lineTo(size, 0); ctx.fill();
            // White Inner Circle
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(0, -size*0.1, size*0.45, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawGoogleBadge(ctx, x, y, size) {
            ctx.save();
            // Outer Shadow Circle
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x, y, size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = 'transparent';

            // Google "G" Logo
            const r = size * 0.3;
            // Blue
            ctx.fillStyle = '#4285f4';
            ctx.beginPath(); ctx.arc(x, y, r, -Math.PI*0.25, Math.PI*0.25); ctx.lineTo(x, y); ctx.fill();
            // Green
            ctx.fillStyle = '#34a853';
            ctx.beginPath(); ctx.arc(x, y, r, Math.PI*0.25, Math.PI*0.75); ctx.lineTo(x, y); ctx.fill();
            // Yellow
            ctx.fillStyle = '#fbbc05';
            ctx.beginPath(); ctx.arc(x, y, r, Math.PI*0.75, Math.PI*1.25); ctx.lineTo(x, y); ctx.fill();
            // Red
            ctx.fillStyle = '#ea4335';
            ctx.beginPath(); ctx.arc(x, y, r, Math.PI*1.25, Math.PI*1.75); ctx.lineTo(x, y); ctx.fill();
            // White Center
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, Math.PI * 2); ctx.fill();
            // Horizontal Bar
            ctx.fillStyle = '#4285f4';
            ctx.fillRect(x, y - r * 0.2, r * 0.9, r * 0.4);

            ctx.restore();
        }

        function drawPhoneNFC(ctx, x, y, size, isDark) {
            ctx.save();
            ctx.strokeStyle = isDark ? '#ffffff' : '#1d4ed8';
            ctx.lineWidth = 4;
            // Phone Body
            drawRoundedRect(ctx, x - size*0.3, y - size*0.5, size*0.6, size, 10);
            ctx.stroke();
            // NFC Waves
            ctx.beginPath();
            ctx.arc(x + size*0.5, y, size*0.3, -Math.PI*0.4, Math.PI*0.4); ctx.stroke();
            ctx.beginPath();
            ctx.arc(x + size*0.5, y, size*0.5, -Math.PI*0.4, Math.PI*0.4); ctx.stroke();
            ctx.restore();
        }

        // Selection Handlers
        function selectTemplate(tplKey) {
            currentTemplate = tplKey;
            customImageLoaded = null;
            document.querySelectorAll('.tpl-btn').forEach(btn => {
                btn.classList.remove('border-blue-500', 'bg-blue-500/10');
                btn.classList.add('border-slate-800', 'bg-slate-950');
            });
            const activeBtn = document.getElementById(`btn_${tplKey}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-slate-800', 'bg-slate-950');
                activeBtn.classList.add('border-blue-500', 'bg-blue-500/10');
            }
            document.getElementById('currentTemplateLabel').innerText = templates[tplKey].name;
            renderCanvas();
        }

        function toggleLogo() {
            showGoogleLogo = !showGoogleLogo;
            const btn = document.getElementById('toggleLogoBtn');
            if (showGoogleLogo) {
                btn.className = 'w-full h-9 bg-blue-600 text-white rounded-lg text-xs font-medium flex items-center justify-center gap-1';
                btn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i> Tampilkan Logo';
            } else {
                btn.className = 'w-full h-9 bg-slate-800 text-slate-400 rounded-lg text-xs font-medium flex items-center justify-center gap-1 border border-slate-700';
                btn.innerHTML = 'Sembunyikan Logo';
            }
            lucide.createIcons();
            renderCanvas();
        }

        function resetCalibration() {
            document.getElementById('scaleInput').value = 100;
            document.getElementById('posXInput').value = 0;
            document.getElementById('posYInput').value = 0;
            renderCanvas();
        }

        function handleCustomUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        customImageLoaded = img;
                        renderCanvas();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        // Main Render Loop
        function renderCanvas() {
            const canvas = document.getElementById('posterCanvas');
            const ctx = canvas.getContext('2d');
            const urlText = document.getElementById('qrInput').value.trim() || 'https://g.page/r/c/review';

            // High Resolution Poster Dimensions (300 DPI ready)
            const canvasWidth = 1000;
            const tplConfig = templates[currentTemplate];
            const canvasHeight = canvasWidth / tplConfig.aspect;

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            // 1. Draw Template Background
            if (customImageLoaded) {
                ctx.drawImage(customImageLoaded, 0, 0, canvasWidth, canvasHeight);
            } else {
                tplConfig.drawBase(ctx, canvasWidth, canvasHeight);
            }

            // 2. Generate Hidden QR Code Image
            const hiddenQrDiv = document.getElementById('qrcode-hidden');
            hiddenQrDiv.innerHTML = '';

            const qrColor = document.getElementById('qrColor').value;

            new QRCode(hiddenQrDiv, {
                text: urlText,
                width: 400,
                height: 400,
                colorDark: qrColor,
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Wait brief moment for QRCode DOM render
            setTimeout(() => {
                const qrImg = hiddenQrDiv.querySelector('img');
                if (qrImg && qrImg.src) {
                    const qrImageObj = new Image();
                    qrImageObj.onload = function() {
                        
                        // Calibration Readings
                        const scale = parseInt(document.getElementById('scaleInput').value) / 100;
                        const offsetX = parseInt(document.getElementById('posXInput').value);
                        const offsetY = parseInt(document.getElementById('posYInput').value);

                        document.getElementById('valScale').innerText = `${Math.round(scale * 100)}%`;
                        document.getElementById('valX').innerText = offsetX;
                        document.getElementById('valY').innerText = offsetY;

                        // Calculate Position inside Template Box Slot
                        const box = tplConfig.qrBox;
                        const qrWidth = box.w * scale;
                        const qrHeight = box.h * scale;
                        const qrX = box.x + (box.w - qrWidth) / 2 + offsetX;
                        const qrY = box.y + (box.h - qrHeight) / 2 + offsetY;

                        // Draw QR Code
                        ctx.drawImage(qrImageObj, qrX, qrY, qrWidth, qrHeight);

                        // 3. Draw Optional Center Google Badge
                        if (showGoogleLogo) {
                            drawGoogleBadge(ctx, qrX + qrWidth/2, qrY + qrHeight/2, qrWidth * 0.22);
                        }
                    };
                    qrImageObj.src = qrImg.src;
                }
            }, 50);
        }

        function downloadPoster() {
            const canvas = document.getElementById('posterCanvas');
            const link = document.createElement('a');
            link.download = `Google-Review-Poster-${currentTemplate}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }

        // Initial Exec
        window.onload = function() {
            renderCanvas();
        };

        // Re-render on live input changes
        document.getElementById('qrInput').addEventListener('input', renderCanvas);
    </script>
</body>
</html>
